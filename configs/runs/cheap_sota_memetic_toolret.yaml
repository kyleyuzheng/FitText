#   https://developers.openai.com/api/docs/pricing
# cheap-SOTA agent for the small-scale sweep — memetic on ToolRet.
# variant: memetic, p5_g3 setting — winning variant.

inherit:
  - configs/_base/benchmarks.yaml
  - configs/_base/embedder.yaml
  - configs/_base/evaluators.yaml
  - configs/_base/infra.yaml

model:
  pin: agents.main_solver
  revision: null
  max_tokens: 2048
  temperature: 1.0                # DFSDT trigger / outer loop
  evolution_temperature: 1.5      # memetic subprocess (seed/mutation/crossover/refine) — rescue T for hard queries
  seed: 42

fittext:
  variant: "memetic"              # uses p5_g3 memetic setting
  population_size: 5              # p5_g3 — winning configuration
  generations: 3
  mutation_prob: 0.5
  crossover_prob: 0.5
  memory_penalty: 0.5             # λ in Eq. 7
  fitness_alpha: 0.7              # α in Eq. 7
  jaccard_threshold: 0.3          # τ in Eq. 7
  selection: "fitness"
  top_k_retrieval: 5

benchmark:
  name: "toolret"
  splits:
    - "code"
    - "customized"
    - "web"
    - "toolbench"
  n_queries_per_split: 50

budget:
  max_cost_usd: 20.0              # ~5 pop × 3 gen ≈ 15 calls/query

extra:
  note: "cheap-SOTA memetic p5_g3 setting on ToolRet. Full Eq. 7 hyperparameters."
  cheap_sota_track: true
