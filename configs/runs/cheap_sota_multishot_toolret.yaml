#   https://developers.openai.com/api/docs/pricing
# cheap-SOTA agent for small-scale sweep — multishot/scattershot on ToolRet.
# scattershot = population of pseudo-tool descriptions per query, no fitness selection.

inherit:
  - configs/_base/benchmarks.yaml
  - configs/_base/embedder.yaml
  - configs/_base/evaluators.yaml
  - configs/_base/infra.yaml

model:
  pin: agents.main_solver
  revision: null
  max_tokens: 2048
  temperature: 1.5                # diversity for scattershot
  seed: 42

fittext:
  variant: "scattershot"
  population_size: 6
  generations: 1                  # no evolution; single population draw
  mutation_prob: 0.0
  crossover_prob: 0.0
  memory_penalty: 0.0
  fitness_alpha: 0.7
  jaccard_threshold: 0.3
  selection: "none"
  top_k_retrieval: 5

benchmark:
  name: "toolret"
  splits:
    - "code"
    - "customized"
    - "web"
    - "toolbench"
  n_queries_per_split: 50

budget:
  max_cost_usd: 20.0              # 6x calls per query vs single_pass

extra:
  note: "cheap-SOTA scattershot (variant: multishot) on ToolRet. 6-population, no selection."
  cheap_sota_track: true
