# Re-Invoke baseline (Chen et al. EMNLP 2024, arXiv 2408.01875) on ToolRet.
# Reimplemented from paper text — no official code release.
# See baselines/reinvoke.py docstring.
#
# Three components (paper §3):
#   §3.1 Query Generator (offline): m=10 synth queries / tool via LLM
#   §3.2 Intent Extractor (online): up to max_intents intents / query
#   §3.3 + Appendix C Algorithm 2: multi-view similarity ranking with
#        averaged-embedding aggregation + tuple (rev_rank, sim) lex sort.
#
# First run: triggers lazy index build (m×n_tools LLM calls + n_tools×m
# embedder calls). Subsequent runs: uses cached sidecar files.

inherit:
  - configs/_base/benchmarks.yaml
  - configs/_base/embedder.yaml
  - configs/_base/evaluators.yaml
  - configs/_base/infra.yaml

model:
  # Uses the main FitText solver pin. Reasoning-model providers may ignore
  # sampling temperature; diversity then comes from independent samples in
  # baselines/reinvoke.py.
  pin: agents.main_solver
  revision: null
  max_tokens: 512
  temperature: 0.0
  seed: 42

fittext:
  # Re-Invoke is NOT an FitText variant. These fields satisfy the schema only.
  variant: "single_pass"
  population_size: 1
  generations: 1
  mutation_prob: 0.0
  crossover_prob: 0.0
  memory_penalty: 0.0
  fitness_alpha: 0.7
  jaccard_threshold: 0.3
  selection: "none"
  top_k_retrieval: 5

benchmark:
  name: "toolret"
  splits:
    - "code"
    - "customized"
    - "web"
    - "toolbench"
  n_queries_per_split: null

budget:
  # Index build is the dominant cost: m=10 generator calls × n_tools per split.
  # Per-query cost is one intent-extract call. Cap at $200 for full sweep.
  max_cost_usd: 200.0

extra:
  baseline_name: "reinvoke"
  paper: "Chen et al. EMNLP 2024 Findings (arXiv 2408.01875)"
  # Re-Invoke specific hparams (read by ReInvokeBaseline from cfg.extra).
  k_synth: 10                  # paper §4.3 m=10 synth queries per tool
  max_intents: 3               # cap (paper does not specify a cap; documented deviation)
  synth_temperature: 0.7       # paper §4.3 value. Some providers strip
                               # temperature/top_p from reasoning-model calls,
                               # so generation runs at the server default (=1.0)
                               # and the m synth queries are independent temp-1.0
                               # samples (no seed pinned). Kept at 0.7 because it
                               # IS honored for temperature-respecting models
                               # and documents the intended paper setting.
  intent_temperature: 0.0      # deterministic intent extraction (also stripped
                               # by providers that disallow custom temperature)
  index_build_concurrency: 8   # parallel LLM calls during index build
  cache_dir: "${FITTEXT_RUNTIME_ROOT:-runs}/reinvoke/cache"
  # benchmark_tag is populated per-split by the runner adapter so the cache
  # key includes the split name.
  note: |
    Paper-faithful reimplementation. Multi-view ranking via Appendix C
    Algorithm 2 (NOT RRF). Tool-doc augmentation: averaged embedding of
    m="Documentation: <doc> Query: <q_i>" copies. Verified by
    tests/test_baseline_reproduction.py::test_reinvoke_*. The prior impl in
    baselines/reinvoke.py up to 2026-05-28 was non-functional (synth-query
    cache built but never consumed at retrieve time).
