# Single source of truth for all model identifiers used by FitText experiments.
# Edit this file to roll forward to a new model; nothing else should hardcode a model name.
#
# ── MAIN SOLVER (canonical agent for ALL experiments) ──
#   main_solver     = gpt-5.4-mini-2026-03-17   (also the canonical judge + simulator)
#   legacy_baseline = gpt-4.1-mini-2025-04-14   (legacy comparison solver; reference row only)
#   Solver migrated 2026-05-31. See the agents: block below.
#
# Cardinal rule: NEVER change evaluators.judge / evaluators.simulator when changing agents.*
# Pinned 2026-05-24 (judge/simulator), 2026-05-31 (main_solver). See configs/PIN_POLICY.md for bump procedure.

agents:
  # MAIN SOLVER — run ALL experiments with this. Canonical as of 2026-05-31.
  main_solver:       "gpt-5.4-mini-2026-03-17"   # == cheap_sota / judge / simulator base model
  # Legacy comparison solver. Reference row only, never the headline.
  legacy_baseline:   "gpt-4.1-mini-2025-04-14"
  gpt_4_1_mini:      "gpt-4.1-mini-2025-04-14"
  gpt_4_1:           "gpt-4.1-2025-04-14"           # full-size planner model (Toolret plan_llm_model)
  gpt_5:             "gpt-5-2025-06-05"             # full-size GPT-5 comparison pin
  claude_sonnet_4_6: "claude-sonnet-4-6-20250514"   # Anthropic comparison pin
  qwen3_30b:         "Qwen3-30B"                     # vLLM-served; no dated tag available
  o3_mini:           "o3-mini-2025-01-31"            # planning/reasoning model for open-domain pipeline
  cheap_sota:        "gpt-5.4-mini-2026-03-17"      # cheap-SOTA agent for small-scale sweeps
                                                     # verified 2026-05-24 from developers.openai.com/api/docs/models
                                                     # rationale: 93.4% tau2-bench, 57.7% MCP Atlas (tool-use SOTA among <$1 input tier);
                                                     # $0.75/$0.075/$4.50 input/cached/output per 1M; native function calling; 400K ctx

evaluators:
  judge:             "gpt-5.4-mini-2026-03-17"  # pinned 2026-05-24. Same base model as cheap_sota agent is OK because the judge sees a different prompt, no DFSDT memory, and no shared ICL — the effective "weights" (model + system prompt + ICL) differ from the agent path.
  simulator:         "gpt-5.4-mini-2026-03-17"  # pinned 2026-05-24; judge == simulator for STB.

embedders:
  toolret:           "sentence-transformers/all-MiniLM-L6-v2"   # confirmed Toolret/eval_toolret.py:64
  stb:               "princeton-nlp/sup-simcse-roberta-large"    # confirmed StableToolBench retriever_server.py docstring
