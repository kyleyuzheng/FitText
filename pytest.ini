[pytest]
python_files = test_*.py smoke_*.py *_test.py
testpaths = tests
markers =
    e2e: end-to-end integration tests (gate benchmark dispatch). Run with: pytest -m e2e
    slow: tests that exceed ~5 seconds (mark explicitly to keep default fast)
    asyncio: marks tests as asyncio coroutines (requires pytest-asyncio)
filterwarnings =
    ignore::pytest.PytestReturnNotNoneWarning
